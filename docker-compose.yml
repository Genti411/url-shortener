services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urls
      POSTGRES_USER: urls
      POSTGRES_PASSWORD: urlspw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urls"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: "postgresql+psycopg2://urls:urlspw@db:5432/urls"
      REDIS_URL: "redis://redis:6379/0"
      RATE_LIMIT: "20"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
